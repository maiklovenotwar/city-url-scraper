[project]
name = "scraping_cityurls"
version = "0.1.0"
description = "City URL extraction and web data integration utilities for Fraunhofer Catalyse project."
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Fraunhofer Catalyse", email = "data@example.org" }
]
readme = "README.md"

# Laufzeit-Abhängigkeiten
# (ggf. später erweitern, z. B. um requests, httpx etc.)
dependencies = [
  "pandas>=2.0",
  "openpyxl>=3.1",
  "requests>=2.31",
  "ddgs>=1.0.0",
  "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
# Entwicklungs-Abhängigkeiten: Linting, Formatting, Tests
dev = [
  "black>=24.0.0",
  "ruff>=0.6.0",
  "pytest>=8.0.0",
  "pytest-mock>=3.12.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 88
target-version = ["py310"]
include = "\\.pyi?$"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
  "E",  # pycodestyle
  "F",  # pyflakes
  "I",  # isort
  "B",  # flake8-bugbear
]
ignore = [
  "E203",  # whitespace before ':' (kompatibel mit Black)
  "E501",  # line length, wird von Black gehandhabt
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

